[project]
name = "halluood"
version = "0.1.0"
description = "Training-free OOD and hallucination calibration for vision-language models"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
    "numpy>=1.26,<3",
    "pillow>=10,<13",
]

[project.optional-dependencies]
inference = [
    "torch>=2.15,<2.16",
    "transformers>=5.22.1,<5.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halluood"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
